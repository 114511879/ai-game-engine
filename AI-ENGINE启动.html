<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>AI-ENGINE 启动</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ============ 侧边栏 ============ -->
<aside id="sidebar">
  <div class="sidebar-header">
    <div class="brand">
      <div class="brand-icon">🎮</div>
      <span class="brand-name">AI 游戏引擎</span>
    </div>
  </div>
  <button class="btn-new-chat" id="btnNewChat" title="Ctrl Shift K">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
    <span>新对话</span>
    <kbd>Ctrl Shift K</kbd>
  </button>
  <div class="sidebar-section">
    <div class="sidebar-label">历史对话</div>
    <div class="history-list" id="historyList">
      <div class="history-empty">暂无对话记录</div>
    </div>
  </div>
  <div class="sidebar-footer">
    <button class="sidebar-footer-btn" id="btnClearAll">清空所有记录</button>
  </div>
</aside>

<!-- ============ 主区域 ============ -->
<main id="main">
  <header class="topbar">
    <div class="topbar-title">
      <span id="convTitle">新对话</span>
    </div>
  </header>

  <!-- 聊天区域 -->
  <div class="chat-area" id="chatArea">
    <!-- 空状态：欢迎页 -->
    <div class="welcome" id="welcomePage">
      <h1 class="hero-text">有什么我能帮你创建的游戏吗？</h1>
      <div class="suggestion-chips">
        <button class="chip" data-prompt="生成一个3关暗黑地牢亡灵Boss">👑 3关暗黑地牢Boss战</button>
        <button class="chip" data-prompt="制作一个快节奏魔法跑酷游戏">🏃 快节奏魔法跑酷</button>
        <button class="chip" data-prompt="三国文字冒险">📖 三国文字冒险</button>
        <button class="chip" data-prompt="制作一个射击弹幕游戏">🔫 射击弹幕游戏</button>
        <button class="chip" data-prompt="生成一个平台跳跃收集游戏">📦 平台跳跃收集</button>
        <button class="chip" data-prompt="生成一个暗黑亡灵地牢，Boss有三阶段，玩家可用火球和护盾">💀 暗黑亡灵三阶段Boss</button>
      </div>
    </div>
    <!-- 消息列表动态插入 -->
    <div class="messages" id="messages"></div>
  </div>

  <!-- 底部输入区 -->
  <div class="input-bar">
    <div class="input-container">
      <div class="input-tools-left">
        <button class="tool-btn" title="跑酷" data-preset="runner">🏃</button>
        <button class="tool-btn" title="射击" data-preset="shooter">🔫</button>
        <button class="tool-btn" title="平台" data-preset="platform">📦</button>
        <button class="tool-btn" title="地牢" data-preset="dungeon">👑</button>
        <button class="tool-btn" title="文字冒险" data-preset="story">📖</button>
      </div>
      <textarea id="prompt" class="chat-input" placeholder="描述你想玩的游戏..." rows="1"></textarea>
      <div class="input-tools-right">
        <button class="tool-btn tool-director" id="btnDirector" title="AI导演：自动分析→生成→测试→优化">
          🧠 <span class="tool-label">导演</span>
        </button>
        <button class="tool-btn tool-test" id="btnGenTest" title="生成+测试：3轮自动优化">
          🔬 <span class="tool-label">测试</span>
        </button>
        <button class="btn-submit" id="btnSubmit" title="生成游戏并在新标签页打开">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </button>
      </div>
    </div>
    <div class="input-hint" id="inputHint">按 Enter 发送 · Shift+Enter 换行 · 点击「完成」生成游戏</div>
  </div>

  <!-- 隐藏的游戏画布（供导演/测试模式使用） -->
  <canvas id="game" width="800" height="400" style="display:none"></canvas>
  <div id="chargeBar" style="display:none"><div id="chargeFill"></div></div>
</main>

<!-- ============ 脚本 ============ -->
<script src="core/dsl/Config.js"></script>
<script src="core/engine/GameStandard.js"></script>
<script src="core/engine/GameState.js"></script>
<script src="core/runtime/helpers.js"></script>
<script src="core/runtime/Collision.js"></script>
<script src="core/runtime/Enemy.js"></script>
<script src="core/runtime/Powerup.js"></script>
<script src="core/runtime/Particle.js"></script>
<script src="core/runtime/Player.js"></script>
<script src="core/runtime/Physics.js"></script>
<script src="core/runtime/Spawner.js"></script>
<script src="core/runtime/Input.js"></script>
<script src="core/runtime/Renderer.js"></script>
<script src="core/dsl/Rules.js"></script>
<script src="core/dsl/PhaseManager.js"></script>
<script src="core/dsl/SkillEngine.js"></script>
<script src="core/dsl/LevelManager.js"></script>
<script src="core/dsl/MapSystem.js"></script>
<script src="core/dsl/AssetSystem.js"></script>
<script src="core/dsl/BossSystem.js"></script>
<script src="core/dsl/SkillSystem.js?v=4"></script>
<script src="core/dsl/DSLBinder.js?v=6"></script>
<script src="core/dsl/PluginSelector.js"></script>
<script src="ai/tester/PlayTestSystem.js"></script>
<script src="ai/tester/BugDetector.js"></script>
<script src="ai/tester/agent.js"></script>
<script src="ai/tester/observer.js"></script>
<script src="ai/tester/anomaly.js"></script>
<script src="ai/tester/debugger.js"></script>
<script src="ai/tester/fixer.js"></script>
<script src="ai/tester/trainer.js"></script>
<script src="plugins/runner/RunnerPlugin.js"></script>
<script src="plugins/shooter/ShooterPlugin.js"></script>
<script src="plugins/rpg/PlatformPlugin.js"></script>
<script src="plugins/rpg/DungeonPlugin.js?v=2"></script>
<script src="ai/generator/AIGenerator.js"></script>
<script src="ai/director/GameDirector.js"></script>
<script src="core/engine/Engine.js"></script>
<script src="plugins/story/StoryPlugin.js?v=14"></script>
<script src="main.js"></script>
</body>
</html>
