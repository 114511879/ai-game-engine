import groovy.json.JsonSlurper
import java.nio.ByteBuffer
import java.nio.ByteOrder
import java.nio.charset.StandardCharsets
import java.security.MessageDigest

plugins {
    id 'com.android.application'
}

def ragAssetDirectory = file('src/main/ragAssets/rag')
def offlineRagAssetNames = [
    'model.onnx',
    'vocab.txt',
    'model-manifest.json',
    'seed-documents.jsonl',
    'seed-vectors.bin'
]

tasks.register('verifyOfflineRagAssets') {
    inputs.files(offlineRagAssetNames.collect { new File(ragAssetDirectory, it) })
    doLast {
        if (!ragAssetDirectory.isDirectory()) {
            throw new GradleException('Offline RAG asset directory is missing')
        }
        offlineRagAssetNames.each { name ->
            if (!new File(ragAssetDirectory, name).isFile()) {
                throw new GradleException('Offline RAG asset is missing: ' + name)
            }
        }

        def manifest = new JsonSlurper().parse(new File(ragAssetDirectory, 'model-manifest.json'))
        if (manifest.model_revision != '7999e1d3359715c523056ef9478215996d62a620') {
            throw new GradleException('Unexpected offline RAG model revision')
        }
        if (manifest.dimension != 512 || manifest.max_tokens != 256) {
            throw new GradleException('Unexpected offline RAG model dimensions')
        }
        if (manifest.pooling != 'cls' || manifest.l2_normalize != true) {
            throw new GradleException('Unexpected offline RAG pooling contract')
        }

        manifest.artifacts.each { name, expectedHash ->
            if (!(name in ['model.onnx', 'vocab.txt', 'seed-documents.jsonl', 'seed-vectors.bin'])) {
                throw new GradleException('Unexpected hashed RAG artifact: ' + name)
            }
            if (!(expectedHash ==~ /[0-9a-f]{64}/)) {
                throw new GradleException('Invalid RAG artifact hash: ' + name)
            }
            def digest = MessageDigest.getInstance('SHA-256')
            new File(ragAssetDirectory, name).withInputStream { stream ->
                byte[] chunk = new byte[1024 * 1024]
                int length
                while ((length = stream.read(chunk)) != -1) {
                    digest.update(chunk, 0, length)
                }
            }
            def actualHash = digest.digest().collect { String.format('%02x', it & 0xff) }.join()
            if (actualHash != expectedHash) {
                throw new GradleException('RAG artifact hash mismatch: ' + name)
            }
        }
        if (manifest.artifacts.keySet() as Set != ['model.onnx', 'vocab.txt', 'seed-documents.jsonl', 'seed-vectors.bin'] as Set) {
            throw new GradleException('RAG artifact manifest is incomplete')
        }

        def seedIds = []
        new File(ragAssetDirectory, 'seed-documents.jsonl').eachLine('UTF-8') { line ->
            if (!line.trim().isEmpty()) {
                def document = new JsonSlurper().parseText(line)
                if (!(document.id instanceof String) || document.id.isEmpty()) {
                    throw new GradleException('Seed document has an invalid ID')
                }
                seedIds.add(document.id)
            }
        }
        if (seedIds.size() != 19 || seedIds.toSet().size() != 19) {
            throw new GradleException('Expected 19 unique offline RAG seed documents')
        }

        byte[] vectorBytes = new File(ragAssetDirectory, 'seed-vectors.bin').bytes
        ByteBuffer vectors = ByteBuffer.wrap(vectorBytes).order(ByteOrder.LITTLE_ENDIAN)
        byte[] magic = new byte[8]
        vectors.get(magic)
        if (!Arrays.equals(magic, 'AGERAG1\u0000'.getBytes(StandardCharsets.US_ASCII))) {
            throw new GradleException('Invalid offline RAG vector magic')
        }
        int vectorCount = vectors.getInt()
        int dimension = vectors.getInt()
        if (vectorCount != 19 || dimension != 512) {
            throw new GradleException('Invalid offline RAG vector header')
        }
        def vectorIds = []
        for (int row = 0; row < vectorCount; row++) {
            if (vectors.remaining() < 2) {
                throw new GradleException('Truncated offline RAG vector ID')
            }
            int idLength = Short.toUnsignedInt(vectors.getShort())
            if (idLength == 0 || vectors.remaining() < idLength + dimension * Float.BYTES) {
                throw new GradleException('Truncated offline RAG vector row')
            }
            byte[] idBytes = new byte[idLength]
            vectors.get(idBytes)
            vectorIds.add(new String(idBytes, StandardCharsets.UTF_8))
            for (int column = 0; column < dimension; column++) {
                float value = vectors.getFloat()
                if (!Float.isFinite(value)) {
                    throw new GradleException('Offline RAG vector contains a non-finite value')
                }
            }
        }
        if (vectors.hasRemaining() || vectorIds != seedIds || vectorIds.toSet().size() != 19) {
            throw new GradleException('Offline RAG vectors do not match seed document order')
        }
    }
}

def webRoot = rootProject.projectDir.parentFile
def generatedWebAssets = layout.buildDirectory.dir('generated/webAssets')
def requiredWebFiles = [
    'index.html',
    'AI-ENGINE启动.html',
    'main.js'
]
def synchronizedRootFiles = [
    'index.html',
    'AI-ENGINE启动.html',
    'game.html',
    'update-announcement.html',
    'styles.css',
    'main.js'
]
def synchronizedDirectories = [
    'ai',
    'assets',
    'core',
    'fitness',
    'plugins'
]

tasks.register('validateWebSources') {
    inputs.files(requiredWebFiles.collect { new File(webRoot, it) })
    doLast {
        def missing = requiredWebFiles.findAll { !new File(webRoot, it).isFile() }
        if (!missing.isEmpty()) {
            throw new GradleException('Missing required web sources: ' + missing.join(', '))
        }
    }
}

tasks.register('syncWebAssets', Sync) {
    dependsOn tasks.named('validateWebSources')
    from(webRoot) {
        synchronizedRootFiles.each { include it }
        synchronizedDirectories.each { include it + '/**' }
        exclude '**/__pycache__/**'
        exclude '**/*.pyc'
    }
    into(generatedWebAssets.map { it.dir('web') })
}

tasks.register('verifyWebAssetSync') {
    dependsOn tasks.named('syncWebAssets')
    doLast {
        def destinationRoot = new File(generatedWebAssets.get().asFile, 'web')

        synchronizedRootFiles.each { relativePath ->
            def source = new File(webRoot, relativePath)
            def packaged = new File(destinationRoot, relativePath)
            if (!source.isFile() || !packaged.isFile()) {
                throw new GradleException('Missing synchronized file: ' + relativePath)
            }
            if (!java.util.Arrays.equals(source.bytes, packaged.bytes)) {
                throw new GradleException('Synchronized file is stale: ' + relativePath)
            }
        }

        synchronizedDirectories.each { relativePath ->
            def sourceDirectory = new File(webRoot, relativePath)
            def packagedDirectory = new File(destinationRoot, relativePath)
            if (!packagedDirectory.isDirectory()) {
                throw new GradleException('Missing synchronized directory: ' + relativePath)
            }
            def sourceFiles = fileTree(sourceDirectory) {
                exclude '**/__pycache__/**'
                exclude '**/*.pyc'
            }.files.collect { sourceDirectory.toPath().relativize(it.toPath()).toString().replace('\\', '/') }.sort()
            def packagedFiles = fileTree(packagedDirectory).files.collect {
                packagedDirectory.toPath().relativize(it.toPath()).toString().replace('\\', '/')
            }.sort()
            if (sourceFiles != packagedFiles) {
                throw new GradleException('Synchronized directory contents differ: ' + relativePath)
            }
            sourceFiles.each { nestedPath ->
                def source = new File(sourceDirectory, nestedPath)
                def packaged = new File(packagedDirectory, nestedPath)
                if (!java.util.Arrays.equals(source.bytes, packaged.bytes)) {
                    throw new GradleException('Synchronized file is stale: ' + relativePath + '/' + nestedPath)
                }
            }
        }

        ['android', 'docs', 'server', 'tests', 'rag'].each { excludedPath ->
            if (new File(destinationRoot, excludedPath).exists()) {
                throw new GradleException('Excluded path was packaged: ' + excludedPath)
            }
        }
    }
}

tasks.register('verifyNoEmbeddedCredentials') {
    dependsOn tasks.named('syncWebAssets')
    doLast {
        def destinationRoot = new File(generatedWebAssets.get().asFile, 'web')
        def credentialPattern = ~/(?i)\bsk-[A-Za-z0-9_-]{12,}/
        fileTree(destinationRoot).files.each { candidate ->
            def searchable = new String(candidate.bytes, 'ISO-8859-1')
            if (credentialPattern.matcher(searchable).find()) {
                def relative = destinationRoot.toPath().relativize(candidate.toPath())
                throw new GradleException('Credential-shaped value found in packaged asset: ' + relative)
            }
        }
    }
}

tasks.register('verifyRuntimeAPIKeyContract') {
    def generatorSource = new File(webRoot, 'ai/generator/AIGenerator.js')
    doLast {
        def sourceText = generatorSource.getText('UTF-8')
        [
            'age.deepseek_api_key',
            'window.prompt',
            "error.code='missing_api_key'",
            'if(error.status===401)clearStoredAPIKey();',
            'localStorage.removeItem'
        ].each { requiredText ->
            if (!sourceText.contains(requiredText)) {
                throw new GradleException('Runtime API key contract is missing: ' + requiredText)
            }
        }
    }
}

tasks.register('verifyBackupPolicyContract') {
    def manifestFile = file('src/main/AndroidManifest.xml')
    def legacyRulesFile = file('src/main/res/xml/backup_rules.xml')
    def dataExtractionRulesFile = file('src/main/res/xml/data_extraction_rules.xml')
    doLast {
        def manifestText = manifestFile.getText('UTF-8')
        [
            'android:allowBackup="false"',
            'android:fullBackupContent="@xml/backup_rules"',
            'android:dataExtractionRules="@xml/data_extraction_rules"',
            'tools:targetApi="s"'
        ].each { requiredText ->
            if (!manifestText.contains(requiredText)) {
                throw new GradleException('Backup policy contract is missing: ' + requiredText)
            }
        }
        [legacyRulesFile, dataExtractionRulesFile].each { rulesFile ->
            if (!rulesFile.isFile() || !rulesFile.getText('UTF-8').contains('<exclude domain="root" path="."')) {
                throw new GradleException('Backup exclusion rules are missing: ' + rulesFile.name)
            }
        }
    }
}

android {
    namespace 'com.aigameengine.app'
    compileSdk 33

    defaultConfig {
        applicationId 'com.aigameengine.app'
        minSdk 26
        targetSdk 33
        versionCode 1
        versionName '1.0-debug'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    buildTypes {
        debug {
            debuggable true
        }
    }

    sourceSets {
        main {
            assets.srcDir(generatedWebAssets)
            assets.srcDir('src/main/ragAssets')
        }
    }

    testOptions {
        unitTests.includeAndroidResources = true
    }
}

tasks.named('preBuild').configure {
    dependsOn tasks.named('verifyNoEmbeddedCredentials')
    dependsOn tasks.named('verifyOfflineRagAssets')
}

tasks.register('verifyMainActivityContract') {
    def activitySource = file('src/main/java/com/aigameengine/app/MainActivity.java')
    doLast {
        if (!activitySource.isFile()) {
            throw new GradleException('MainActivity.java is missing')
        }
        def sourceText = activitySource.getText('UTF-8')
        [
            'APP_ASSET_PREFIX + "index.html"',
            'setJavaScriptEnabled(true)',
            'setDomStorageEnabled(true)',
            'onReceivedError',
            'canGoBack()',
            'file:///android_asset/web/',
            'startsWith(APP_ASSET_PREFIX)',
            'webView.onPause()',
            'webView.pauseTimers()',
            'webView.onResume()',
            'webView.resumeTimers()',
            'addJavascriptInterface',
            '"AndroidRag"',
            'LocalRagEngine.create(this)',
            'ragBridge.close()',
            'removeJavascriptInterface("AndroidRag")'
        ].each { requiredText ->
            if (!sourceText.contains(requiredText)) {
                throw new GradleException('MainActivity contract is missing: ' + requiredText)
            }
        }
        ['AI-ENGINE启动.html', 'game.html'].each { pageName ->
            def pageText = new File(webRoot, pageName).getText('UTF-8')
            ["frame-src 'none'", "object-src 'none'", 'https://api.deepseek.com'].each { requiredText ->
                if (!pageText.contains(requiredText)) {
                    throw new GradleException('Content Security Policy is missing from ' + pageName + ': ' + requiredText)
                }
            }
        }
    }
}

tasks.named('check').configure {
    dependsOn tasks.named('verifyWebAssetSync')
    dependsOn tasks.named('verifyNoEmbeddedCredentials')
    dependsOn tasks.named('verifyRuntimeAPIKeyContract')
    dependsOn tasks.named('verifyBackupPolicyContract')
    dependsOn tasks.named('verifyMainActivityContract')
    dependsOn tasks.named('verifyOfflineRagAssets')
}

dependencies {
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.20.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.10.3'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test:runner:1.5.2'
}
